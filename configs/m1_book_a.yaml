model_id: "Qwen/Qwen2.5-7B-Instruct"
revision: "a09a3545"
stage: "M1_Book_A"
dataset_path: "data/book_a/train_clean.jsonl"
output_dir: "./checkpoints/m1_book_a"

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  num_train_epochs: 2
  fp16: true
  optim: "paged_adamw_8bit"
  logging_steps: 5
