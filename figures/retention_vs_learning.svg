<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <rect width="720" height="380" fill="#ffffff" rx="8"/>
  <rect x="20" y="20" width="680" height="340" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="50" y="58" font-size="18" font-weight="700" fill="#0f172a">Knowledge Retention Across Sequential Training Stages</text>
  <text x="50" y="80" font-size="12" fill="#64748b">Qwen2.5-7B-Instruct (revision a09a3545) on Book A (Photosynthesis) Retention Panel (N=54)</text>

  <!-- Y-Axis Grid Lines & Labels -->
  <line x1="120" y1="280" x2="650" y2="280" stroke="#cbd5e1" stroke-width="1"/>
  <text x="95" y="284" font-size="11" fill="#64748b" text-anchor="end">0%</text>

  <line x1="120" y1="230" x2="650" y2="230" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="95" y="234" font-size="11" fill="#64748b" text-anchor="end">25%</text>

  <line x1="120" y1="180" x2="650" y2="180" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="95" y="184" font-size="11" fill="#64748b" text-anchor="end">50%</text>

  <line x1="120" y1="130" x2="650" y2="130" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="95" y="134" font-size="11" fill="#64748b" text-anchor="end">75%</text>

  <line x1="120" y1="100" x2="650" y2="100" stroke="#e2e8f0" stroke-dasharray="4"/>
  <text x="95" y="104" font-size="11" fill="#64748b" text-anchor="end">100%</text>

  <!-- Bars (Baseline scale: 0 to 50% score mapped from y=280 to y=100) -->
  <!-- M0: 38.9% -> height = 38.9 * 3.6 = 140px -> y = 280 - 140 = 140 -->
  <rect x="160" y="140" width="70" height="140" fill="#94a3b8" rx="4"/>
  <text x="195" y="132" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">38.9%</text>
  <text x="195" y="156" font-size="11" fill="#ffffff" text-anchor="middle">21 / 54</text>
  <text x="195" y="302" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">M0 (Base)</text>
  <text x="195" y="318" font-size="10" fill="#64748b" text-anchor="middle">Untrained</text>

  <!-- M1: 37.0% -> height = 37.0 * 3.6 = 133px -> y = 280 - 133 = 147 -->
  <rect x="285" y="147" width="70" height="133" fill="#3b82f6" rx="4"/>
  <text x="320" y="139" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">37.0%</text>
  <text x="320" y="163" font-size="11" fill="#ffffff" text-anchor="middle">20 / 54</text>
  <text x="320" y="302" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">M1 Checkpoint</text>
  <text x="320" y="318" font-size="10" fill="#64748b" text-anchor="middle">Book A Reference</text>

  <!-- M2 Naive: 42.6% -> height = 42.6 * 3.6 = 153px -> y = 280 - 153 = 127 -->
  <rect x="410" y="127" width="70" height="153" fill="#f59e0b" rx="4"/>
  <text x="445" y="119" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">42.6%</text>
  <text x="445" y="143" font-size="11" fill="#ffffff" text-anchor="middle">23 / 54</text>
  <text x="445" y="302" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">M2 Naive</text>
  <text x="445" y="318" font-size="10" fill="#64748b" text-anchor="middle">Sequential SFT</text>

  <!-- M2 Protected: 38.9% -> height = 38.9 * 3.6 = 140px -> y = 280 - 140 = 140 -->
  <rect x="535" y="140" width="70" height="140" fill="#10b981" rx="4"/>
  <text x="570" y="132" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">38.9%</text>
  <text x="570" y="156" font-size="11" fill="#ffffff" text-anchor="middle">21 / 54</text>
  <text x="570" y="302" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">M2 Protected</text>
  <text x="570" y="318" font-size="10" fill="#059669" text-anchor="middle">Orthogonal LoRA</text>

  <!-- Legend -->
  <line x1="50" y1="345" x2="670" y2="345" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="362" font-size="11" fill="#64748b" text-anchor="middle">Paired Bootstrap 95% Confidence Interval: [-9.3%, +0.0%] across 5,000 resamples</text>
</svg>
